# Mirror
RURIMA_LXC_MIRROR=mirrors.tuna.tsinghua.edu.cn/lxc-images
RURIMA_LXC_MIRROR_FALLBACK=images.linuxcontainers.org

# OS to install (直接指定 OpenWRT)
# Make sure there is ${RURIMA_LXC_OS} in setup/setup.sh
RURIMA_LXC_OS=openwrt

# OS version to install (OpenWRT 23.05.3 稳定版)
RURIMA_LXC_OS_VERSION=23.05.3

# OS dir to install (OpenWRT 容器目录)
# The actual directory is the `CONTAINER_DIR` in `customize.sh`
CONTAINER_DIR=/data/openwrt

# 登录密码和端口
PASSWORD=123456
PORT=22

# ========== OpenWRT 23.05+ (armsr/armv8) 专属配置 ==========
OPENWRT_STABLE_VERSION="23.05.3"
# OpenWRT 23.05.3 稳定版下载地址（armsr/armv8，修正后的正确路径）
OPENWRT_URL="https://downloads.openwrt.org/releases/${OPENWRT_STABLE_VERSION}/targets/armsr/armv8/openwrt-${OPENWRT_STABLE_VERSION}-armsr-armv8-rootfs.tar.gz"
# OpenWRT 开发版地址（如需切换，只需把上面的 VERSION 改为 edge）
OPENWRT_EDGE_URL="https://downloads.openwrt.org/snapshots/targets/armsr/armv8/openwrt-armsr-armv8-rootfs.tar.gz"

# ruri config (原版默认配置，无需修改)
REQUIRE_SUDO=true
MOUNT_POINT=/data/media/0
MOUNT_ENTRANCE=/sdcard
MOUNT_READ_ONLY=true
UNMASK_DIRS=false
PRIVILEGED=false
RUNTIME=false
